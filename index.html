<!DOCTYPE html>
<html>
<head>
  <title>Pageant Scoring System</title>
  <style>
    body { font-family: Arial, sans-serif; }
    table { border-collapse: collapse; width: 95%; margin: 20px auto; }
    th, td { border: 1px solid #ccc; padding: 6px; text-align: center; }
    h1, h2 { text-align: center; }
    .winner { font-weight: bold; background: #dff0d8; }
    input { width: 60px; }
    .controls { text-align:center; margin-bottom: 15px; }
    button { margin: 5px; padding: 8px 15px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Pageant Scoring System</h1>

  <div class="controls">
    <button onclick="calculate()">Compute Results</button>
    <button onclick="exportCSV()">Export Results (CSV)</button>
  </div>

  <table id="scoreTable">
    <thead>
      <tr>
        <th>Contestant</th>
        <th>Judge</th>
        <th>Talent (40%)</th>
        <th>Beauty (30%)</th>
        <th>Q&A (30%)</th>
        <th>Total</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <h2>Overall Results</h2>
  <table>
    <thead>
      <tr>
        <th>Contestant</th>
        <th>Average Score</th>
      </tr>
    </thead>
    <tbody id="resultsTable"></tbody>
  </table>

  <script>
    // Configurable contestants and judges
    const contestants = ["Alice", "Bob", "Carla", "David"];
    const judges = ["Judge 1", "Judge 2", "Judge 3"];

    // Build scoring table dynamically
    const tbody = document.querySelector("#scoreTable tbody");

    contestants.forEach(contestant => {
      judges.forEach((judge, jIndex) => {
        let row = document.createElement("tr");
        if (jIndex === 0) {
          let td = document.createElement("td");
          td.innerText = contestant;
          td.rowSpan = judges.length;
          row.appendChild(td);
        }
        let tdJudge = document.createElement("td");
        tdJudge.innerText = judge;
        row.appendChild(tdJudge);

        ["talent", "beauty", "qa"].forEach(cat => {
          let td = document.createElement("td");
          let input = document.createElement("input");
          input.type = "number";
          input.max = 100;
          td.appendChild(input);
          row.appendChild(td);
        });

        let tdTotal = document.createElement("td");
        tdTotal.classList.add("total");
        row.appendChild(tdTotal);

        tbody.appendChild(row);
      });
    });

    let lastResults = []; // store last computed results

    function calculate() {
      let contestantsData = {};

      tbody.querySelectorAll("tr").forEach(row => {
        let contestantCell = row.querySelector("td[rowspan]");
        let contestant;
        if (contestantCell) {
          contestant = contestantCell.innerText;
        } else {
          let prev = row.previousElementSibling;
          while (prev && !prev.querySelector("td[rowspan]")) {
            prev = prev.previousElementSibling;
          }
          contestant = prev.querySelector("td[rowspan]").innerText;
        }

        let inputs = row.querySelectorAll("input");
        if (inputs.length > 0) {
          let score = 
            (inputs[0].value * 0.4 || 0) +
            (inputs[1].value * 0.3 || 0) +
            (inputs[2].value * 0.3 || 0);

          row.querySelector(".total").textContent = score.toFixed(2);

          if (!contestantsData[contestant]) contestantsData[contestant] = [];
          contestantsData[contestant].push(score);
        }
      });

      let results = [];
      for (let c in contestantsData) {
        let avg = contestantsData[c].reduce((a,b) => a+b, 0) / contestantsData[c].length;
        results.push({ name: c, avg: avg });
      }

      results.sort((a, b) => b.avg - a.avg);
      lastResults = results; // save for CSV export

      let resultsBody = document.getElementById("resultsTable");
      resultsBody.innerHTML = "";
      results.forEach((r, i) => {
        let tr = document.createElement("tr");
        if (i === 0) tr.classList.add("winner");
        tr.innerHTML = `<td>${r.name}</td><td>${r.avg.toFixed(2)}</td>`;
        resultsBody.appendChild(tr);
      });
    }

    function exportCSV() {
      if (lastResults.length === 0) {
        alert("Please compute results first!");
        return;
      }

      let csv = "Contestant,Average Score\n";
      lastResults.forEach(r => {
        csv += `${r.name},${r.avg.toFixed(2)}\n`;
      });

      let blob = new Blob([csv], { type: "text/csv" });
      let url = window.URL.createObjectURL(blob);
      let a = document.createElement("a");
      a.href = url;
      a.download = "pageant_results.csv";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }
  </script>
</body>
</html>
